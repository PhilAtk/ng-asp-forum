<h1>{{post.author.userName}}</h1>
<h2>{{post.text}}</h2>

<table>
  <tr>
    <th>Date</th>
    <th>Action</th>
    <th>Info</th>
  </tr>
  @for (audit of audits; track audit) {
    <tr>
      <td>{{audit.date}}</td>
      <td>{{postActionMap.get(audit.action)}}</td>
      <td>{{audit.info}}</td>
    </tr>
  }
</table>

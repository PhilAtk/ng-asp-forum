<h1>{{_user.userName}}</h1>

@if (_editMode) {
  <span>
    <input type="text" [(ngModel)]="editBuffer">
    <button (click)="saveBio()">Save</button>
    <button (click)="cancelEdit()">Cancel</button>
  </span>
} @else {
  @if (_canEdit) {
    <span>
      <button (click)="editBio()">Edit</button>
    </span>
  }
  <div>
    <p>{{_user.bio}}</p>
  </div>
}

@if (_admin) {
  <span>
    @if (_user.userState >= 0) {
      <app-ban-button [user]="_user"></app-ban-button>
    }
    @if (_user.userState == -2) {
      <app-unban-button [user]="_user"></app-unban-button>
    }
    <a [routerLink]="['/user/audit', _user.userID]">Audit</a>
  </span>
}

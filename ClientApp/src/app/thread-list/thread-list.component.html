<table>
  <tr>
    <th>Topic</th>
    <th>Date</th>
    <th>Posts</th>
  </tr>
  <style>td {outline: solid black 1px;}</style>
  @for (thread of threads; track thread) {
    <tr>
      <td><a class="nav-link text-dark" [routerLink]="['/thread', thread.threadID]">{{thread.topic}}</a></td>
      <td>{{thread.date}}</td>
      <td>{{thread.numPosts}}</td>
    </tr>
  }
</table>
